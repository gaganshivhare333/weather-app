<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤 WeatherNow</h1>

        <p class="subtitle">Check real-time weather for any city</p>

       <form class="search-box" onsubmit="getWeather(event)">
    <input
        type="text"
        id="city"
        placeholder="Enter city name"
    >
    <button type="submit">Search</button>
    </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
