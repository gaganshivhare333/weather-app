

<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>WeatherNow</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🌤 WeatherNow</h1>

<p class="subtitle">
Real-Time Weather Application
</p>

<form class="search-box"
onsubmit="getWeather(event)">

<input
id="city"
type="text"
placeholder="Enter City Name">

<button type="submit">

🔍

</button>

</form>

<button
class="location-btn"
onclick="getLocation()">

📍 Use My Location

</button>

<div id="loading">

Loading...

</div>

<div id="result">

</div>

<footer>

Powered by OpenWeather API

<br>

Developed by Gagan Shivhare

</footer>

</div>

<script src="script.js"></script>

</body>

</html>
